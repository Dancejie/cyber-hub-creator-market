services:
  - type: web
    name: cyber-hub-creator-market
    runtime: static
    buildCommand: echo "Deployment intentionally disabled"
    staticPublishPath: ./offline
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

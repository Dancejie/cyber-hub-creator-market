services:
  - type: web
    name: cyber-hub-creator-market
    runtime: static
    buildCommand: echo "Using the prebuilt Cyber Hub five-world bundle"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /meme-town/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /world-runtime/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
